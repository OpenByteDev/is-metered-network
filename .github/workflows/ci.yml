name: CI

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

env:
  CARGO_TERM_COLOR: always
  RUSTDOCFLAGS: "--deny warnings"
  RUSTFLAGS: "--deny warnings"

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
    - uses: actions/checkout@v7
    - name: Install latest stable
      uses: dtolnay/rust-toolchain@stable
    - name: Build
      run: cargo build
    - name: Test
      run: cargo test

  docs:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7
    - name: Install latest stable
      uses: dtolnay/rust-toolchain@stable
    - name: Generate documentation
      run: cargo doc

  clippy:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
    - uses: actions/checkout@v7
    - name: Install latest stable
      uses: dtolnay/rust-toolchain@stable
      with:
        components: clippy
    - name: Clippy check
      run: cargo clippy

  fmt:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
    - uses: actions/checkout@v7
    - name: Install latest stable
      uses: dtolnay/rust-toolchain@stable
      with:
        components: rustfmt
    - name: Format check
      run: cargo fmt --all -- --check
